spring:
  application:
    name: ethos-nutrition-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ethos_nutrition?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Vedant#04}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
server:
  error:
    include-message: never
app:
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-secure-32-character-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
